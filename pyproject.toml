[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cleantext-cli"
version = "1.0.0"
description = "Lightweight terminal AI text style purification engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
    {name = "CleanText Contributors"},
]
keywords = ["ai-detection", "text-cleaning", "cli", "writing", "style-checker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[project.scripts]
cleantext = "cleantext_cli.cli:main"

[tool.setuptools]
packages = ["cleantext_cli", "cleantext_cli.rules"]
